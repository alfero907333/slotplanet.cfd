<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3a833;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e29722;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#125d44"/>
  
  <!-- Ball Base -->
  <circle cx="256" cy="256" r="200" fill="#ffffff"/>
  
  <!-- Football Pattern (Pentagons) -->
  <g fill="#125d44">
    <!-- Center Pentagon -->
    <path d="M256 180 l-72 52 28 84 h88 l28 -84 z"/>
    
    <!-- Top -->
    <path d="M256 180 V56 l-110 36 -28 88 138 0 z" opacity="0.9"/>
    
    <!-- Bottom Left -->
    <path d="M184 316 l-72 60 40 80 104 0 V316 z" opacity="0.9"/>
    
    <!-- Bottom Right -->
    <path d="M328 316 l 72 60 -40 80 -104 0 V316 z" opacity="0.9"/>
    
    <!-- Top Left -->
    <path d="M184 232 l-128 10 32 90 96 -100 z" opacity="0.8"/>
    
    <!-- Top Right -->
    <path d="M328 232 l 128 10 -32 90 -96 -100 z" opacity="0.8"/>
  </g>
  
  <!-- Gold Highlight/Border -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#ballGrad)" stroke-width="16"/>
  
  <!-- Subtle Inner Shadow -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="black" stroke-opacity="0.1" stroke-width="8"/>
</svg>
